version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/*.sql"
    schema: "internal/db/migrations/*.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_prepared_queries: true
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_db_tags: true
        overrides:
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "weekday"
            go_type: "string"
          - db_type: "date"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
          - db_type: "text"
            go_type:
              type: "string"
          - db_type: "pg_catalog.bool"
            go_type:
              type: "bool"
            nullable: true
          - db_type: "text"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.varchar"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.varchar"
            go_type:
              type: "string"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
            nullable: true
          - db_type: "pg_catalog.time"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "integer"
            go_type:
              type: "int32"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.int4"
            go_type:
              type: "int32"
              pointer: true
            nullable: true
          - db_type: "float"
            go_type:
              type: "float32"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.float8"
            go_type:
              type: "float32"
              pointer: true
            nullable: true
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.NullUUID"
            nullable: true
