name: E2E Tests

on:
  workflow_dispatch:
    
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbauser
          POSTGRES_PASSWORD: password1234
          POSTGRES_DB: dba_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9200:9200
      
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Install dependencies
      run: |
        go mod download
        go mod verify

    - name: Wait for services
      run: |
        echo "Waiting for PostgreSQL..."
        until pg_isready -h localhost -p 5432 -U dbauser; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 2
        done
        
        echo "Waiting for Elasticsearch..."
        until curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green\|yellow"'; do
          echo "Waiting for Elasticsearch to be ready..."
          sleep 5
        done

    - name: Run E2E tests
      env:
        TEST_DB_HOST: localhost
        TEST_DB_PORT: 5432
        TEST_DB_NAME: dba_test
        TEST_DB_USER: dbauser
        TEST_DB_PASSWORD: password1234
        TEST_REDIS_URL: localhost:6379
        TEST_ES_URL: http://localhost:9200
        TEST_S3_ENDPOINT: http://localhost:9000
        TEST_S3_ACCESS_KEY: minioadmin
        TEST_S3_SECRET_KEY: minioadmin
      run: |
        make e2e

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: |
          **/*test*.log
          e2e-coverage.out
          e2e-coverage.html
        retention-days: 7

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./e2e-coverage.out
        flags: e2e
        name: e2e-coverage
        fail_ci_if_error: false
